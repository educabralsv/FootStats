<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FootStats | Cadastro</title>
    <link rel="stylesheet" href="../styles/cadastro.css">
</head>
<body>
    <div class="cabecalho">
        <div class="logo">
            <img src="../assets/FootStats - Logo.png" alt="">
        </div>
        <div class="navbar">
            <li>
                <a href="index.html">Home</a>
            </li>
            <li>
                <a href="index.html">Objetivo</a>
            </li>
            <li>
                <a href="index.html">Valores</a>
            </li>
            <li>
                <a href=index.html>Minha História</a>
            </li>
            <a href="login.html"><button class="botao-login">Login</button></a> 
        </div>
    </div>

    <div class="box-login-pai">
        <img src="../assets/FootStats - Logo.png" alt="">
        <div class="box-login-filho">
            <div class="boas-vindas">
                <span>Cadastrar</span>
            </div>
            <div class="campos">
                <label for="ipt_nome"><img src="" alt="">Nome</label>
                <input type="text" id="ipt_nome" placeholder="Digite seu nome">
                <br>
                <select id="time"><img src="" alt="">
                    <option value="" selected disabled>Selecione o time que você torce</option>
                    <option value="">Atlético Mineiro</option>
                    <option value="">Botafogo</option>
                    <option value="">Corinthians</option>
                    <option value="">Cruzeiro</option>
                    <option value="">Flamengo</option>
                    <option value="">Fluminense</option>
                    <option value="">Grêmio</option>
                    <option value="">Internacional</option>
                    <option value="">Palmeiras</option>
                    <option value="">Santos</option>
                    <option value="">São Paulo</option>
                    <option value="">Vasco</option>
                </select> 
                <br>
                <label for="ipt_email"><img src="" alt="">Email</label>
                <input type="text" id="ipt_email" placeholder="footstats@gmail.com">
                <br>
                <label for="ipt_senha"><img src="" alt="">Senha</label>
                <input type="password" id="ipt_senha" placeholder="Digite a senha">
                <br>
                <label for="ipt_confirmarSenha"><img src="" alt="">Confirmar Senha</label>
                <input type="password" id="ipt_confirmar_senha" placeholder="Confirme a senha">
            </div>
        </div>
    </div>
</body>
</html>
